name: Test build (signed APK, NOT released)

# Builds a release-signed APK from a non-main branch so it can be installed over the
# customer app for testing. No GitHub Release is created; customers get nothing.
# Download it from the run page -> Artifacts -> Talk2Type-test-apk.
on:
  push:
    branches:
      - 'voice-fix'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: chmod +x ./android/gradlew || true
      - run: flutter pub get

      - name: Version (same code as latest release, so it installs over it)
        id: v
        run: |
          LATEST=$(git tag -l 'v2.1.*' | sort -V | tail -1)
          N=${LATEST##*.}
          [ -z "$N" ] && N=1
          echo "NAME=2.1.$N" >> $GITHUB_OUTPUT
          echo "CODE=$N" >> $GITHUB_OUTPUT
          echo "Test build as 2.1.$N ($N)"

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.T2T_KEYSTORE_BASE64 }}" ]; then echo "::error::T2T_KEYSTORE_BASE64 missing"; exit 1; fi
          echo "${{ secrets.T2T_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build signed APK
        env:
          T2T_KEYSTORE_PATH: /tmp/release.jks
          T2T_KEYSTORE_PASSWORD: ${{ secrets.T2T_KEYSTORE_PASSWORD }}
          T2T_KEY_ALIAS: ${{ secrets.T2T_KEY_ALIAS }}
          T2T_KEY_PASSWORD: ${{ secrets.T2T_KEY_PASSWORD }}
        run: |
          flutter build apk --release --android-skip-build-dependency-validation \
            --build-name="${{ steps.v.outputs.NAME }}" --build-number="${{ steps.v.outputs.CODE }}"

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/release.jks

      - run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Talk2Type-test-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Type-test-apk
          path: out/*.apk
          retention-days: 7
