name: Build & Release Talk2Type APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Set App Version
        id: versioning
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building Talk2Type version $VERSION_NAME ($BUILD_NUMBER)..."

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versioning.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_dist
          cp build/app/outputs/flutter-apk/app-release.apk release_dist/Talk2Type.apk
          cp build/app/outputs/flutter-apk/app-release.apk "release_dist/Talk2Type-${{ steps.versioning.outputs.VERSION_TAG }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.VERSION_TAG }}
          name: Talk2Type ${{ steps.versioning.outputs.VERSION_TAG }}
          body: |
            ## Talk2Type ${{ steps.versioning.outputs.VERSION_TAG }}
            - স্বয়ংক্রিয় রিলিজ ও পারফরম্যান্স আপডেট
            - বাংলা ভয়েস টাইপিং ও এআই যতিচিহ্ন সংস্কার
            - ওটিএ (OTA) অটো-আপডেট আর্কিটেকচার
          draft: false
          prerelease: false
          files: |
            release_dist/Talk2Type.apk
            release_dist/Talk2Type-${{ steps.versioning.outputs.VERSION_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
