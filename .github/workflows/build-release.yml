name: Build & Release Talk2Type APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x ./android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Set App Version
        id: versioning
        run: |
          VERSION_TAG="v2.1.${{ github.run_number }}"
          VERSION_NAME="2.1.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building Talk2Type version $VERSION_NAME ($BUILD_NUMBER)..."

      - name: Decode Release Keystore
        run: |
          if [ -z "${{ secrets.T2T_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret T2T_KEYSTORE_BASE64 is missing! A release build must be signed with the official release key."
            exit 1
          fi
          echo "${{ secrets.T2T_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          if [ ! -s /tmp/release.jks ]; then
            echo "::error::Decoded keystore is empty or failed to decode!"
            exit 1
          fi
          echo "Keystore successfully decoded to /tmp/release.jks"

      - name: Build Android Release APK
        env:
          T2T_KEYSTORE_PATH: /tmp/release.jks
          T2T_KEYSTORE_PASSWORD: ${{ secrets.T2T_KEYSTORE_PASSWORD }}
          T2T_KEY_ALIAS: ${{ secrets.T2T_KEY_ALIAS }}
          T2T_KEY_PASSWORD: ${{ secrets.T2T_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --build-name="${{ steps.versioning.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.jks

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_dist
          # Find and copy generated release APK
          PRIMARY_APK=$(find build/app/outputs/flutter-apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$PRIMARY_APK" ]; then
            cp "$PRIMARY_APK" release_dist/Talk2Type.apk
            cp "$PRIMARY_APK" "release_dist/Talk2Type-${{ steps.versioning.outputs.VERSION_TAG }}.apk"
            echo "Copied $PRIMARY_APK to release_dist/Talk2Type.apk"
          else
            echo "Error: No release APK found!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: Talk2Type ${{ steps.versioning.outputs.VERSION_TAG }}
          body: |
            ## Talk2Type ${{ steps.versioning.outputs.VERSION_TAG }}
            - সম্পূর্ণ ৫টি টোন মোড (বাংলা, অফিসিয়াল, কাস্টমার সার্ভিস, বন্ধুসুলভ, ইংরেজি অনুবাদ)
            - BYOK (নিজের Gemini API কি ব্যবহারের স্বাধীনতা)
            - লেখা ঠিক করো (AI Text Rewrite) ও ৫ সেকেন্ডের Undo সুবিধা
            - স্বয়ংক্রিয় ভয়েস কমান্ড ("নতুন লাইন", "দাঁড়ি", "কমা", "প্রশ্নবোধক", "শেষ বাক্য মুছো", "সব মুছো")
            - ভয়েস শর্টকাট (Snippets) দিয়ে তাত্ক্ষণিক বড় বার্তা টাইপিং
            - হোয়াটসঅ্যাপ ভয়েস নোট থেকে টেক্সট রূপান্তর (Audio Share Target)
            - হিস্ট্রি এক্সপোর্ট (.txt ও Excel-বান্ধব UTF-8 CSV)
            - সুরক্ষিত ওটিএ (OTA) অটো-আপডেট ও ক্রিপ্টোগ্রাফিক সিগনেচার যাচাইকরণ
          draft: false
          prerelease: false
          files: |
            release_dist/Talk2Type.apk
            release_dist/Talk2Type-${{ steps.versioning.outputs.VERSION_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
